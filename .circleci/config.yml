version: 2.1

jobs:
  pipeline:
    docker:
      - image: benwiley4000/emsdk-puppeteer
    working_directory: ~/volca-sampler
    steps:
      - checkout
      - run: git submodule init && git submodule update --recursive
      - run:
          name: Install Node.js from .nvmrc
          command: |
            export NVM_DIR="$HOME/.nvm"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
            echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            . "$NVM_DIR/nvm.sh"
            nvm install
      - run: npm ci
      - run: npm test
      - store_artifacts:
          path: ~/volca-sampler/test/artifacts
      - run: npm run build
      - add_ssh_keys:
          fingerprints:
            - 'b2:9e:19:9a:08:bf:99:8f:3e:ba:c3:7f:70:da:b4:d1'
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config user.email "therealbenwiley@gmail.com"
            git config user.name "Ben Wiley"
            npm run deploy

workflows:
  build:
    jobs:
      - pipeline
